# Strata-softwareservice reverse proxy. Rendered by deploy/install.sh (@SERVER_NAMES@, @APP_PORT@, @FORWARDED_PROTO@).
# certbot --nginx adds the 443 server block and HTTP->HTTPS redirect when HTTPS is enabled.
# Behind Cloudflare Tunnel, TLS ends at Cloudflare and the app is told the request was https.

map $http_upgrade $strata_connection_upgrade {
    default upgrade;
    ''      "";
}

upstream strata_softwareservice {
    server 127.0.0.1:@APP_PORT@;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;

    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /_next/static/ {
        proxy_pass http://strata_softwareservice;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Internal health endpoint: only reachable from the server itself.
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://strata_softwareservice;
    }

    location / {
        proxy_pass http://strata_softwareservice;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto @FORWARDED_PROTO@;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $strata_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
